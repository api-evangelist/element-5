name: element 5 AG
description: >-
  element 5 AG was a German e-commerce and digital-distribution company founded
  in 2000 and headquartered in Cologne, Germany. It operated a platform that let
  software developers and publishers sell their products and licenses directly to
  customers online, growing to more than 10,000 clients across 150 countries and
  becoming one of Europe's leading software e-commerce providers. element 5 was
  acquired by U.S.-based Digital River (its direct competitor) for roughly $120M
  and subsequently absorbed and renamed Digital River GmbH, ceasing to operate as
  an independent company. It was an early Earlybird Venture Capital portfolio
  company; this profile records its identity and exit. No live independent API or
  developer surface remains to enrich.
